name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM, Android, API check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (JVM + Android unit tests)
        run: ./gradlew jvmTest testDebugUnitTest --stacktrace
      - name: Public API unchanged
        run: ./gradlew apiCheck
      - name: Samples compile
        run: ./gradlew :samples:jvm-cli:compileKotlinJvm :samples:android-chat:assembleDebug
      - name: API docs build
        run: ./gradlew dokkaGenerate

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS compile and simulator tests
        run: ./gradlew compileKotlinIosArm64 iosSimulatorArm64Test --stacktrace
