name: Release

# Push a tag like v0.1.0 to publish that version to Maven Central (as a staged deployment
# you then release in the Central Portal), create a GitHub Release, and publish the API docs.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    # macOS: the iOS artifacts can only be built there.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test before publishing
        run: ./gradlew allTests apiCheck -PVERSION_NAME=$VERSION --stacktrace

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral -PVERSION_NAME=$VERSION --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Build API docs
        run: ./gradlew dokkaGenerate -PVERSION_NAME=$VERSION

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed in $VERSION."
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
