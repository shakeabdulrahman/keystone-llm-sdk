org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
# iOS targets only build on macOS; skip them quietly on Linux CI.
kotlin.native.ignoreDisabledTargets=true
# Dokka 2 Gradle plugin mode.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Published coordinates: io.github.shakeabdulrahman:keystone-llm-<module>:<VERSION_NAME>
GROUP=io.github.shakeabdulrahman
# Semantic version. 0.x: the public API may still change between minor versions.
VERSION_NAME=0.1.0-SNAPSHOT

POM_NAME=Keystone LLM SDK
POM_DESCRIPTION=Kotlin Multiplatform LLM client for Android and iOS: streaming, tool calling, structured output and automatic provider failover.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/shakeabdulrahman/keystone-llm-sdk
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/shakeabdulrahman/keystone-llm-sdk
POM_SCM_CONNECTION=scm:git:git://github.com/shakeabdulrahman/keystone-llm-sdk.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/shakeabdulrahman/keystone-llm-sdk.git
POM_DEVELOPER_ID=shakeabdulrahman
POM_DEVELOPER_NAME=Shaik Abdul Rahman
POM_DEVELOPER_URL=https://github.com/shakeabdulrahman
org.gradle.tooling.parallel=true

# Maven Central (Central Portal) via com.vanniktech.maven.publish. Releases are signed;
# credentials and the signing key come from ~/.gradle/gradle.properties or CI secrets only.
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
